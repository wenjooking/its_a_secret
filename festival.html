<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>For You ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="js/auth.js"></script>
  <script src="js/theme.js" defer></script>
</head>
<body class="page-festival">

  <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch to light theme">
    <svg class="theme-toggle__icon theme-toggle__icon--sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
    </svg>
    <svg class="theme-toggle__icon theme-toggle__icon--moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <a class="back-link" href="index.html" id="backLink">
    <span class="back-link__icon" aria-hidden="true">←</span>
    Moments
  </a>

  <section class="hero">
    <canvas id="fireworks"></canvas>
    <div class="hero-caption">
      <p class="hero-caption__title" id="heroTitle"></p>
      <p class="hint show" id="hint">Scroll to read ↓</p>
    </div>
  </section>

  <section class="letter-section">
    <p class="section-label">Your letter</p>
    <h1 id="letterTitle">A Letter For You</h1>
    <div class="letter" id="letterBlock"></div>
    <p class="letter-placeholder hidden" id="letterPlaceholder"></p>
  </section>

  <footer class="credit" id="credit">Credit by Wenjoo</footer>

  <audio id="music" preload="none"></audio>

  <script src="js/seen-store.js"></script>
  <script src="js/viewport.js"></script>
  <script src="js/heart.js"></script>
  <script src="js/festival-page.js"></script>
</body>
</html>
