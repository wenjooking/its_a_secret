<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Sign in · 🐻 & 🐰</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="js/theme.js" defer></script>
  <script src="js/action-menu.js" defer></script>
</head>
<body class="page-login">

  <div class="action-menu action-menu--login" id="actionMenu">
    <div class="action-menu__extras">
      <button type="button" class="fab-btn theme-toggle" id="themeToggle" aria-label="Switch to light theme">
        <svg class="theme-toggle__icon theme-toggle__icon--sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="theme-toggle__icon theme-toggle__icon--moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
    <button type="button" class="fab-btn fab-btn--main" id="actionMenuToggle" aria-expanded="false" aria-label="Open menu">
      <svg class="fab-btn__arrow" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 15.5 5 8h14l-7 7.5z"/>
      </svg>
    </button>
  </div>

  <div class="home-glow" aria-hidden="true"></div>

  <main class="login-main">
    <div class="login-card">
      <p class="login-emoji" aria-hidden="true">🐻 & 🐰</p>
      <h1 class="login-title">Our secret space</h1>
      <p class="login-subtitle">Sign in to continue</p>

      <div class="passcode-form" id="passcodeForm">
        <label class="login-label" for="loginName">Name</label>
        <input
          class="login-name"
          type="text"
          id="loginName"
          name="name"
          autocomplete="name"
          autocapitalize="none"
          spellcheck="false"
          placeholder="Your name"
          required
        />

        <label class="login-label" for="passcodeDisplay">Passcode</label>
        <div
          class="passcode-display"
          id="passcodeDisplay"
          aria-label="Passcode"
        >
          <span class="passcode-value" id="passcodeValue" aria-hidden="true"></span>
        </div>

        <p class="login-error hidden" id="loginError" role="alert"></p>

        <div class="numpad" id="numpad">
          <button type="button" class="numpad__key" data-digit="1">1</button>
          <button type="button" class="numpad__key" data-digit="2">2</button>
          <button type="button" class="numpad__key" data-digit="3">3</button>
          <button type="button" class="numpad__key" data-digit="4">4</button>
          <button type="button" class="numpad__key" data-digit="5">5</button>
          <button type="button" class="numpad__key" data-digit="6">6</button>
          <button type="button" class="numpad__key" data-digit="7">7</button>
          <button type="button" class="numpad__key" data-digit="8">8</button>
          <button type="button" class="numpad__key" data-digit="9">9</button>
          <button type="button" class="numpad__key numpad__key--action" data-action="clear" aria-label="Clear passcode">Clear</button>
          <button type="button" class="numpad__key" data-digit="0">0</button>
          <button type="button" class="numpad__key numpad__key--action" data-action="back" aria-label="Delete last digit">⌫</button>
        </div>
      </div>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
